name: Check links

on:
  schedule:
    - cron: "0 5 * * 1"   # weekly, Monday
  workflow_dispatch:
  pull_request:
    paths:
      - "**.md"

jobs:
  lychee:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Link Checker
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --max-retries 2
            --timeout 20
            --accept 200,201,202,203,204,206,301,302,308,403,429
            --exclude '^http://flaws2?\.cloud'
            './**/*.md'
          fail: false
